name: "Proof-of-Work"
description: "Re-check an AI agent's work against facts: real tests, diff tampering, coverage."
inputs:
  mutation:
    description: "Also run mutation testing (slower)."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install proof-of-work
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../..
      run: python -m pip install "$ACTION_ROOT"
    - name: Run gate
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BASE_SHA: ${{ github.event.before }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          pull_request) base="$PR_BASE_SHA" ;;
          push) base="$PUSH_BASE_SHA" ;;
          *) echo "Unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
        esac
        if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$base" =~ ^0+$ ]]; then
          echo "Missing or invalid base commit for $GITHUB_EVENT_NAME" >&2
          exit 1
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          if ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "Could not fetch base commit $base" >&2
            exit 1
          fi
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "Base commit $base is unavailable" >&2
          exit 1
        fi
        flags=""
        if [ "${{ inputs.mutation }}" = "true" ]; then flags="--mutation"; fi
        proof-of-work check --base "$base" $flags
