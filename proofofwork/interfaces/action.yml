name: "Proof-of-Work"
description: "Re-check an AI agent's work against facts: real tests, diff tampering, coverage."
inputs:
  mutation:
    description: "Also run mutation testing (slower)."
    required: false
    default: "false"
  coverage-policy:
    description: "required (default), or explicit test-only evidence with no trusted baseline."
    required: false
    default: "required"
  integrity-policy:
    description: "strict (default), or advisory; advisory is not a human approval."
    required: false
    default: "strict"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install proof-of-work
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../..
      run: python -m pip install "$ACTION_ROOT"
    - name: Run gate
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BASE_SHA: ${{ github.event.before }}
        MUTATION: ${{ inputs.mutation }}
        COVERAGE_POLICY: ${{ inputs.coverage-policy }}
        INTEGRITY_POLICY: ${{ inputs.integrity-policy }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          pull_request) base="$PR_BASE_SHA" ;;
          push) base="$PUSH_BASE_SHA" ;;
          *) echo "Unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
        esac
        if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$base" =~ ^0+$ ]]; then
          echo "Missing or invalid base commit for $GITHUB_EVENT_NAME" >&2
          exit 1
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          if ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "Could not fetch base commit $base" >&2
            exit 1
          fi
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "Base commit $base is unavailable" >&2
          exit 1
        fi
        case "$COVERAGE_POLICY" in required|test-only) ;; *) echo "Invalid coverage policy" >&2; exit 1 ;; esac
        case "$INTEGRITY_POLICY" in strict|advisory) ;; *) echo "Invalid integrity policy" >&2; exit 1 ;; esac
        flags=()
        case "$MUTATION" in true) flags+=(--mutation) ;; false) ;; *) echo "Invalid mutation input" >&2; exit 1 ;; esac
        proof-of-work check --base "$base" --coverage-policy "$COVERAGE_POLICY" \
          --integrity-policy "$INTEGRITY_POLICY" "${flags[@]}"
