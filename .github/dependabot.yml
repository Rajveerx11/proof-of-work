version: 2
updates:
  # keep the Actions in these workflows current (security patches, new majors)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Update Python requirements and uv.lock together for locked CI installs.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
