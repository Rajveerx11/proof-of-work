name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Reuse this workflow for releases without cancelling an in-flight tag validation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up uv + Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install reviewed dependencies and verify lock consistency
        run: uv sync --locked --extra dev
      - name: Run Python and Node-backed corpus and configured-suite tests
        run: uv run --frozen pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install locked lint tooling
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --frozen ruff check .

  report:
    name: static HTML report artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Generate empty-history report
        run: uv run --frozen proof-of-work eval report --format html --output report.html
      - name: Upload static report
        uses: actions/upload-artifact@v7
        with:
          name: proof-of-work-eval-report
          path: report.html
          if-no-files-found: error

  package:
    name: build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify lock consistency
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the built wheel outside the checkout
        run: bash .github/scripts/smoke-wheel.sh
      # Release consumes these exact tested distributions from this reusable workflow.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  real-js-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Real Jest and Vitest coverage and execution evidence
        run: uv run --frozen python -m pytest -q integration/test_js_coverage.py
