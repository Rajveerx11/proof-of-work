name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to test, build,
# attest, publish to PyPI, and cut a GitHub Release.
on:
  push:
    tags: ["v*"]

jobs:
  # Never publish a tag whose tests don't pass — the gate before the gate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - run: uv run pytest -q
      - run: uv run ruff check .

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"   # pin for reproducible builds
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proof-of-work-agent
    permissions:
      id-token: write       # PyPI Trusted Publishing (OIDC) — no stored API token
      attestations: write   # SLSA build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # On brand: a tamper-evidence tool signs its own release artifacts.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Attach the exact wheel + sdist so the release page is downloadable and
      # matches the PyPI artifacts (and their attestations).
      - name: Create GitHub Release with artifacts
        run: >-
          gh release create "${{ github.ref_name }}" --generate-notes
          dist/* reports/v0.2.0/index.html reports/v0.2.0/results.json
        env:
          GH_TOKEN: ${{ github.token }}
