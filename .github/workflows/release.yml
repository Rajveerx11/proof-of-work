name: Release

# Tag a version to validate the supported matrix, build, attest and publish the
# exact tested distributions. Publication still uses the protected PyPI environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same matrix, lint, reports and installed-wheel validation gate PRs and tags.
  test:
    uses: ./.github/workflows/ci.yml

  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Verify matching release evidence
        run: |
          test -s "reports/${GITHUB_REF_NAME}/README.md"
          test -s "reports/${GITHUB_REF_NAME}/index.html"
          test -s "reports/${GITHUB_REF_NAME}/results.json"

  publish:
    needs: [test, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/proof-of-work-agent
    permissions:
      id-token: write       # PyPI Trusted Publishing (OIDC) — no stored API token
      attestations: write   # SLSA build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Attach the same validated wheel and sdist that were attested and published.
      - name: Create GitHub Release with artifacts
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          dist/* "reports/${GITHUB_REF_NAME}/README.md"
          "reports/${GITHUB_REF_NAME}/index.html" "reports/${GITHUB_REF_NAME}/results.json"
        env:
          GH_TOKEN: ${{ github.token }}
