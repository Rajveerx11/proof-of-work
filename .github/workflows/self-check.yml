name: Self-check (dogfood)

# Proof-of-Work gates its OWN pull requests — the product proving itself in CI.
# If a change to this repo tried to delete a test, fake a pass, or drop coverage,
# this job blocks it exactly the way it would for any consumer.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0   # need the base commit in history to diff against it
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # dev extra installs pytest so the gate can actually RE-RUN our suite,
      # not just scan the diff. (uv sync, not --system: the runner's system
      # Python is PEP-668 externally-managed.)
      - name: Install (with reviewed locked coverage tooling)
        run: uv sync --locked --extra dev
      # Fixed reviewed fixture floor, not a baseline proposed by the candidate.
      - name: Real required coverage comparison (positive and negative regression)
        run: uv run --frozen python -m pytest -q tests/test_coverage_policy.py -k actual_baseline_comparison
      # Explicitly measure the immutable reviewed base when it has no baseline.
      # Changed dependency inputs fail closed; never use candidate bootstrap output.
      - name: Gate this PR's diff against its base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen proof-of-work check --base "$PR_BASE_SHA" --measure-base-coverage
